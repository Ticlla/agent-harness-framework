<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Orchestrator Batch Loop</title>
  <desc id="desc">Intake worklist, setup worktree, delegate with gates, human review, then merge.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2E7D32"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#888888"/>
    </marker>
  </defs>
  <text x="600" y="48" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="28" font-weight="600" fill="#1a1a1a">Orchestrator Runtime</text>
  <text x="600" y="82" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="15" fill="#888888">Built harness batch flow (section 14)</text>
  <g font-family="IBM Plex Sans, system-ui, sans-serif">
    <ellipse cx="120" cy="220" rx="72" ry="36" fill="#f5f5f5" stroke="#888888" stroke-width="2"/>
    <text x="120" y="226" text-anchor="middle" font-size="14" fill="#666666">Start</text>
    <rect x="230" y="188" width="130" height="64" rx="10" fill="#ffffff" stroke="#2E7D32" stroke-width="2"/>
    <text x="295" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#2E7D32">Intake</text>
    <text x="295" y="236" text-anchor="middle" font-size="11" fill="#666666">worklist</text>
    <rect x="400" y="188" width="150" height="64" rx="10" fill="#ffffff" stroke="#2E7D32" stroke-width="2"/>
    <text x="475" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#2E7D32">Worktree</text>
    <text x="475" y="236" text-anchor="middle" font-size="11" fill="#666666">isolation</text>
    <line x1="192" y1="220" x2="228" y2="220" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="360" y1="220" x2="398" y2="220" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <rect x="590" y="130" width="520" height="280" rx="16" fill="none" stroke="#2E7D32" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="850" y="158" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#2E7D32">Batch loop</text>
  <g font-family="IBM Plex Sans, system-ui, sans-serif">
    <rect x="630" y="190" width="150" height="64" rx="10" fill="#e8f5e9" stroke="#2E7D32" stroke-width="2"/>
    <text x="705" y="218" text-anchor="middle" font-size="13" font-weight="600" fill="#2E7D32">Delegate</text>
    <text x="705" y="238" text-anchor="middle" font-size="11" fill="#555555">sub-workflow</text>
    <rect x="820" y="190" width="130" height="64" rx="10" fill="#e8f5e9" stroke="#2E7D32" stroke-width="2"/>
    <text x="885" y="218" text-anchor="middle" font-size="13" font-weight="600" fill="#2E7D32">Gates</text>
    <text x="885" y="238" text-anchor="middle" font-size="11" fill="#555555">section 7</text>
    <polygon points="990,222 1020,242 990,262 960,242" fill="#ffffff" stroke="#888888" stroke-width="2"/>
    <text x="990" y="246" text-anchor="middle" font-size="11" fill="#666666">Pass?</text>
    <line x1="780" y1="222" x2="818" y2="222" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="950" y1="222" x2="958" y2="222" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="550" y1="220" x2="588" y2="220" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M1020 242 L1058 242 L1058 340 L705 340" fill="none" stroke="#2E7D32" stroke-width="2"/>
    <line x1="705" y1="340" x2="705" y2="256" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="880" y="328" text-anchor="middle" font-size="11" fill="#2E7D32">next item</text>
    <path d="M990 262 L990 300 L650 300" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="5 4"/>
    <line x1="650" y1="300" x2="650" y2="256" stroke="#888888" stroke-width="2" marker-end="url(#arrow-grey)"/>
    <text x="820" y="292" text-anchor="middle" font-size="11" fill="#888888">fail -&gt; record / escalate</text>
  </g>
  <g font-family="IBM Plex Sans, system-ui, sans-serif">
    <rect x="320" y="470" width="170" height="64" rx="10" fill="#ffffff" stroke="#2E7D32" stroke-width="2"/>
    <text x="405" y="498" text-anchor="middle" font-size="13" font-weight="600" fill="#2E7D32">Human review</text>
    <text x="405" y="518" text-anchor="middle" font-size="11" fill="#666666">HITL</text>
    <rect x="540" y="470" width="150" height="64" rx="10" fill="#2E7D32"/>
    <text x="615" y="498" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">PR / merge</text>
    <text x="615" y="518" text-anchor="middle" font-size="11" fill="#e8f5e9">done</text>
    <line x1="850" y1="410" x2="850" y2="502" stroke="#2E7D32" stroke-width="2"/>
    <line x1="850" y1="502" x2="492" y2="502" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="490" y1="502" x2="538" y2="502" stroke="#2E7D32" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="850" y="430" text-anchor="middle" font-size="11" fill="#888888">no more items</text>
  </g>
</svg>
